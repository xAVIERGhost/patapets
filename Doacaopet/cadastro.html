<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pata Perto | Cadastro</title>
  <link rel="stylesheet" href="style.css">
     <style>
          * {
            font-family: Arial, Helvetica, sans-serif;
          }
          .formulario {
  max-width: 500px;
  margin: 20px auto;
  padding: 24px;
  background-color: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-family: Arial, sans-serif;
}

.formulario label {
  display: block;
  margin: 14px 0 6px;
  font-weight: bold;
}

.formulario input,
.formulario select,
.formulario textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font: inherit;
}

.formulario textarea {
  min-height: 100px;
  resize: vertical;
}

.formulario button {
  width: 100%;
  margin-top: 18px;
  padding: 11px;
  border: none;
  border-radius: 6px;
  background-color: #176b57;
  color: white;
  font-size: 1rem;
  cursor: pointer;
}

.formulario button:hover {
  background-color: #125443;
}
header {
  background-color: #176b57;
  color: white;
  padding: 18px;
}

header a {
  color: white;
}




    </style>
</head>
<body>
  <header>
    <h1 class="logo">🐾 Pata Perto</h1>
    <nav aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="pets.html">Pets</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="doacoes.html">Doações</a>
    </nav>
  </header>

  <main>
    <h2>Crie seu cadastro</h2>
    <p>Preencha seus dados para participar da comunidade Pata Perto.</p>

    <form class="formulario" action="#" method="post">
      
      <label for="interesse">Qual é o seu interesse?</label>
      <select id="interesse" name="interesse" required>
        <option value="">Selecione uma opção</option>
        <option value="adotar">Quero adotar</option>
        <option value="doar">Quero doar</option>
        <option value="voluntariar">Quero ser voluntário(a)</option>
      </select><br>
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" placeholder="Nome completo" required><br>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required><br>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"><br>

      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade" placeholder="Cidade" required><br>

      

      <label for="senha">Crie uma senha:</label>
      <input type="password" id="senha" name="senha" minlength="8" placeholder="Mínimo 8 caracteres" required><br><br>

      

      <button class="botao" type="submit">Criar cadastro</button>
    </form>
  </main>

 
</body>
</html>
